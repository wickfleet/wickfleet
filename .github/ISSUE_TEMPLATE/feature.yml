name: Feature request
description: Something Wickfleet should do for a fleet of bots.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Features for a single bot's views usually belong upstream in FreqUI or Freqtrade.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you run (how many bots, dry or live) and what is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
